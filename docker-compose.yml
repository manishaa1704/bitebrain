version: '3.8'

services:
  api:
    build: .
    container_name: bitebrain-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///./bitebrain.db
      - SECRET_KEY=bitebrain-super-secret-key-change-this-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      # Provide your actual key in your local .env file instead
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
